name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: GTK and WebKit for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Rust tests
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Rust tests
        run: cargo test --workspace

      - name: NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: shale-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
