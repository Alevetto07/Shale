name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: GTK and WebKit for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            libstdc++-13-dev \
            cmake

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Printer resources
        run: ./scripts/fetch-resources.sh

      - name: CuraEngine 5.13 (AppImage extract)
        run: ./scripts/fetch-curaengine.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          SHALE_CURA_DIR: ${{ github.workspace }}/vendor/Cura
          SHALE_MATERIALS_DIR: ${{ github.workspace }}/vendor/fdm_materials
          SHALE_ORCA_DIR: ${{ github.workspace }}/vendor/BambuStudio/resources/profiles
          SHALE_CURAENGINE: ${{ github.workspace }}/vendor/curaengine/CuraEngine
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/13
        run: cargo test --workspace --locked

      - name: Auto nonplanar E2E bench
        env:
          SHALE_CURA_DIR: ${{ github.workspace }}/vendor/Cura
          SHALE_MATERIALS_DIR: ${{ github.workspace }}/vendor/fdm_materials
          SHALE_ORCA_DIR: ${{ github.workspace }}/vendor/BambuStudio/resources/profiles
          SHALE_CURAENGINE: ${{ github.workspace }}/vendor/curaengine/CuraEngine
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/13
        run: ./scripts/bench-auto-nonplanar.sh

      - name: Upload auto-placement bench
        uses: actions/upload-artifact@v4
        with:
          name: nonplanar-bench-e2e
          path: |
            artifacts/nonplanar/bench-e2e-report.json
            artifacts/nonplanar/bench-e2e-table.md
            artifacts/nonplanar/planar-supports-parity.json
          if-no-files-found: warn

      - name: Planar supports G-code parity vs base
        env:
          SHALE_CURA_DIR: ${{ github.workspace }}/vendor/Cura
          SHALE_MATERIALS_DIR: ${{ github.workspace }}/vendor/fdm_materials
          SHALE_ORCA_DIR: ${{ github.workspace }}/vendor/BambuStudio/resources/profiles
          SHALE_CURAENGINE: ${{ github.workspace }}/vendor/curaengine/CuraEngine
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/13
          PLANAR_PARITY_BASE_REF: origin/cursor/v02-nonplanar-88ff
        run: ./scripts/planar-supports-gcode-parity.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Printer resources
        shell: pwsh
        run: ./scripts/fetch-resources.ps1

      - name: CuraEngine 5.13 (installer extract)
        shell: pwsh
        run: ./scripts/fetch-curaengine.ps1

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        env:
          SHALE_CURA_DIR: ${{ github.workspace }}/vendor/Cura
          SHALE_MATERIALS_DIR: ${{ github.workspace }}/vendor/fdm_materials
          SHALE_ORCA_DIR: ${{ github.workspace }}/vendor/BambuStudio/resources/profiles
          SHALE_CURAENGINE: ${{ github.workspace }}/vendor/curaengine/CuraEngine.exe
          SHALE_CURAENGINE_LIB_DIR: ${{ github.workspace }}/vendor/curaengine
        run: cargo test --workspace --locked

      - name: Rust clippy
        env:
          SHALE_CURA_DIR: ${{ github.workspace }}/vendor/Cura
          SHALE_MATERIALS_DIR: ${{ github.workspace }}/vendor/fdm_materials
          SHALE_ORCA_DIR: ${{ github.workspace }}/vendor/BambuStudio/resources/profiles
          SHALE_CURAENGINE: ${{ github.workspace }}/vendor/curaengine/CuraEngine.exe
          SHALE_CURAENGINE_LIB_DIR: ${{ github.workspace }}/vendor/curaengine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Verify Shale.exe is a GUI subsystem binary
        shell: bash
        run: python3 scripts/verify-gui-subsystem.py target/release/Shale.exe

      - name: Installer UI screenshots (100/125/150% DPI)
        shell: pwsh
        continue-on-error: true
        run: |
          $setup = Get-ChildItem -Path target/release/bundle/nsis/Shale_*_x64-setup.exe -ErrorAction Stop | Select-Object -First 1
          ./scripts/installer-screenshots.ps1 -Installer $setup.FullName -OutDir dist/installer-screenshots

      - name: Title bar smoke (UI Automation)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Resolve-Path target/release/Shale.exe
          ./scripts/titlebar-smoke.ps1 -Exe $exe.Path

      - uses: actions/upload-artifact@v4
        with:
          name: shale-windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            dist/installer-screenshots/**
          if-no-files-found: error
