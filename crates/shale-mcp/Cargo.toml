[package]
name = "shale-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server that drives Shale Core"
publish = false

[[bin]]
name = "shale-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "3.8", features = ["server", "macros", "client", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shale-core = { path = "../shale-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
