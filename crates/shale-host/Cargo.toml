[package]
name = "shale-host"
version = "0.1.0"
edition = "2021"
description = "Bambu LAN host for Shale: MQTT status, FTPS upload, print control"
publish = false

[features]
# Builds the loopback printer as a runnable binary, so a window can be pointed
# at a machine that exists. Off by default: a release build has no use for it,
# and `cargo build --workspace --release` should not put a printer on disk.
fake-printer = []

[[bin]]
name = "shale-fake-printer"
path = "src/bin/fake_printer.rs"
required-features = ["fake-printer"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# SHA-256 for the certificate pin. Already in the lockfile through rustls.
sha2 = "0.10"

[dev-dependencies]
# The test double is a TLS server and speaks JSON, so it needs the same two
# crates the client uses. Both are already in the lockfile through this crate's
# own dependencies: nothing new is downloaded to run the tests.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde_json = "1"
# The queue's state machine is the other half of the wiring under test.
shale-core = { path = "../shale-core" }
