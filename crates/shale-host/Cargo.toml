[package]
name = "shale-host"
version = "0.1.4"
edition = "2021"
description = "Bambu LAN host for Shale: MQTT status, FTPS upload, print control"
license.workspace = true
publish = false

[features]
# Builds the loopback printer as a runnable binary, so a window can be pointed
# at a machine that exists. Off by default: a release build has no use for it,
# and `cargo build --workspace --release` should not put a printer on disk.
fake-printer = []
# ONNX Runtime for the optional Obico failure model. Off in the library's own
# test build. The desktop app turns it on. The weights are not downloaded here.
onnx = ["dep:ort"]
# Compile OpenH264 from the BSD-2 source. Off in a release build: Cisco's
# patent promise covers the official binary downloaded at first use, not a
# library built here. `cargo build --release` must not pass this feature.
openh264-source = ["openh264/source"]

[[bin]]
name = "shale-fake-printer"
path = "src/bin/fake_printer.rs"
required-features = ["fake-printer"]

[dependencies]
# The cloud client is the only part of Shale that speaks outside the LAN. It is
# a small HTTP/1.1 client over the rustls already in this crate rather than a
# full HTTP stack: reqwest 0.13 drags in a platform verifier, sixteen crates and
# a C build of aws-lc, and this needs one GET and two POSTs of JSON.
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# JPEG frames from the chamber camera, the GIF preview of a timelapse, and the
# pictures the failure watch and the plate check compare. MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
# Cisco OpenH264. `libloading` is the release path: the official binary is
# downloaded on first use and loaded from the app data directory. The
# `openh264-source` feature of this crate is the only way the C library is
# compiled, and a release build leaves it off.
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
# Unpacks Cisco's `.bz2` archive. MIT OR Apache-2.0, and it bundles libbzip2.
bzip2 = "0.5"
# SHA-256 for the certificate pin. Already in the lockfile through rustls.
sha2 = "0.10"
# ONNX Runtime, MIT OR Apache-2.0. Optional: the grid detector does not need
# it, and a test never downloads the Obico weights. `download-binaries` fetches
# the runtime library at build time, not the model.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }

[dev-dependencies]
# The test double is a TLS server and speaks JSON, so it needs the same two
# crates the client uses. Both are already in the lockfile through this crate's
# own dependencies: nothing new is downloaded to run the tests.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde_json = "1"
# The queue's state machine is the other half of the wiring under test.
shale-core = { path = "../shale-core" }
