[package]
name = "shale-core"
version = "0.1.0"
edition = "2021"
description = "Job model, Cura profile resolution, and CuraEngine orchestration for Shale"
publish = false

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation", "filters"] }
truck-modeling = "0.6"
truck-stepio = "0.3"
truck-topology = "0.6"
zip = "2.2"
