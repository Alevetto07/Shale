[workspace]
resolver = "2"
members = [
    "crates/shale-core",
    "crates/shale-nonplanar",
    "crates/shale-host",
    "crates/shale-mcp",
    "crates/shale-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
license = "AGPL-3.0-or-later"

# Import, tessellation and slicing all spend their time inside dependencies
# (serde_json, zip, truck, tokio). Optimising only the dependency crates keeps
# `cargo build -p shale-desktop` in the same ballpark as before while the
# runtime cost drops by roughly an order of magnitude; a debug binary used to
# take minutes to read a large 3MF.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The non-planar pass is O(cells x triangles) ray casting plus per-vertex mesh
# deformation; at opt-level 1 the fixtures in `cargo test` take minutes because
# that inner loop stays unoptimised. Dependencies are already at 3, only the
# crate's own code was left at 1.
[profile.dev.package.shale-nonplanar]
opt-level = 3

# Tests and benchmarks run the same code paths as the app, so they use the same
# settings instead of the slower unoptimised default.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3

# Same reason as the dev override: `cargo test -p shale-nonplanar` spends its
# time in this crate, so the test profile has to optimise it too.
[profile.test.package.shale-nonplanar]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
