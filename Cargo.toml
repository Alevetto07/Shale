[workspace]
resolver = "2"
members = ["crates/shale-core", "crates/shale-mcp", "apps/desktop/src-tauri"]

# Import, tessellation and slicing all spend their time inside dependencies
# (serde_json, zip, truck, tokio). Optimising only the dependency crates keeps
# `cargo build -p shale-desktop` in the same ballpark as before while the
# runtime cost drops by roughly an order of magnitude; a debug binary used to
# take minutes to read a large 3MF.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Tests and benchmarks run the same code paths as the app, so they use the same
# settings instead of the slower unoptimised default.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
